    <main>
        <h1>Part 2. jQuery Effects</h1>
        <h2>Task 2. Visibility Methods</h2>
        <p id="visibilityText">This paragraph can be hidden and shown.</p>
        <button id="hideButton">Hide</button>
        <button id="showButton">Show</button>
        <button id="toggleButton">Toggle</button>

        <h2>Task 3. Fade Methods</h2>
        <img src="cat.jpeg" id="fadeImage" alt="cat">
        <button id="fadeOutButton">Fade Out</button>
        <button id="fadeInButton">Fade In</button>
        <button id="fadeToggleButton">Fade Toggle</button>

        <h2>Task 4. Slide Methods</h2>
        <div id="slidePanel">
            This panel can slide up and down using jQuery.
        </div>
       <button id="slideUpButton">Slide Up</button>
       <button id="slideDownButton">Slide Down</button>
       <button id="slideToggleButton">Slide Toggle</button>

    </main>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
